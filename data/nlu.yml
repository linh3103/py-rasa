    - Làm sao để gọi tổng đài?
    - điện thoại chăm sóc khách hàng?
    

- intent: ask_working_hours
  examples: |
    - Trung tâm làm việc vào giờ nào?
    - Giờ làm việc của tổng đài là gì?
    - Tôi có thể gọi lúc mấy giờ?
    - Trung tâm hoạt động từ mấy giờ đến mấy giờ?
    - Khi nào tôi có thể liên hệ được?

- intent: ask_lunch_break
  examples: |
    - Trung tâm có nghỉ trưa không?
    - Có thể gọi vào buổi trưa không?
    - Giờ nghỉ trưa là lúc nào?
    - Tổng đài nghỉ lúc mấy giờ?

- intent: ask_weekend_holiday
  examples: |
    - Trung tâm có làm việc cuối tuần không?
    - Có mở cửa vào Chủ nhật không?
