version: "3.1"

nlu:
- intent: greet
  examples: |
    - hey
    - hello
    - hi
    - hello there
    - good morning
    - good evening
    - moin
    - hey there
    - let's go
    - hey dude
    - goodmorning
    - goodevening
    - good afternoon

- intent: goodbye
  examples: |
    - cu
    - good by
    - cee you later
    - good night
    - bye
    - goodbye
    - have a nice day
    - see you around
    - bye bye
    - see you later

- intent: affirm
  examples: |
    - yes
    - y
    - indeed
    - of course
    - that sounds good
    - correct

- intent: deny
  examples: |
    - no
    - n
    - never
    - I don't think so
    - don't like that
    - no way
    - not really

- intent: mood_great
  examples: |
    - perfect
    - great
    - amazing
    - feeling like a king
    - wonderful
    - I am feeling very good
    - I am great
    - I am amazing
    - I am going to save the world
    - super stoked
    - extremely good
    - so so perfect
    - so good
    - so perfect

- intent: mood_unhappy
  examples: |
    - my day was horrible
    - I am sad
    - I don't feel very well
    - I am disappointed
    - super sad
    - I'm so sad
    - sad
    - very sad
    - unhappy
    - not good
    - not very good
    - extremly sad
    - so saad
    - so sad

- intent: bot_challenge
  examples: |
    - are you a bot?
    - are you a human?
    - am I talking to a bot?
    - am I talking to a human?

- intent: active_order_form
  examples: |
    - Tôi muốn mua hàng
    - Tôi cần đặt hàng
    - Hỗ trợ tôi order
    - Tôi cần hỗ trợ đặt hàng online
    - Đặt hàng online

- intent: enter_order_info
  examples: |
    - Tôi muốn mua [chăn](product_name)
    - Tôi thích cái [gối](product_name) này, hỗ trợ tôi đặt hàng
    - Cái [rèm cửa](product_name) được đó, tôi muốn mua
    - Tôi muốn mua cái [áo thun](product_name) màu [đen](color) size [L](size).
    - Cho mình đặt [quần jean](product_name) size [32](size) màu [xanh đen](color).
    - Mình đặt [áo sơ mi](product_name) [2](count) cái màu [trắng](color) nha.
    - Có [áo khoác](product_name) size [XL](size) màu [xám](color) không bạn?
    - Cho mình [1](count) cái [váy](product_name) màu [đỏ](color), size [S](size).
    - Mình cần [3](count) cái [áo polo](product_name) size [M](size), đủ màu.
    - Tôi muốn mua cái [đầm](product_name) size [L](size), màu [be](color).
    - Mình lấy cái [quần short](product_name) màu [kem](color), size [30](size).
    - Cho mình đặt [áo hoodie](product_name) size [XL](size), màu [xanh lá](color).
    - Mình cần [2](count) cái [áo sơ mi](product_name), size [M](size), màu [xanh navy](color).
    - [Quần jean nam](product_name), size [31](size)
    - [Áo thun nữ](product_name), màu [đỏ](color)
    - Có [drap nệm hello kitty](product_name) không cu?
