version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - hello_world
  - active_order_form
  - enter_order_info

responses:
  utter_greet:
  - text: "Hey! How are you?"

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Did that help you?"

  utter_happy:
  - text: "Great, carry on!"

  utter_goodbye:
  - text: "Bye"

  utter_iamabot:
  - text: "I am a bot, powered by Rasa."

  utter_ask_product_name:
  - text: "Bạn muốn mua sản phẩm nào? Vui lòng cung cấp tên sản phẩm bên dưới:"

  utter_ask_size:
  - text: "Bạn mặc vừa size nào? Ví dụ: S, M, L, XL, XXL"

  utter_ask_color:
  - text: "Bạn muốn màu gì?"

  utter_ask_count:
  - text: "Bạn muốn mua bao nhiêu sản phẩm?"

  utter_ask_user_name:
  - text: "Cho tôi biết tên người nhận hàng?"

  utter_ask_address:
  - text: "Được rồi {user_name}, cho tôi biết địa chỉ đặt hàng của bạn"

  utter_ask_phone_number:
  - text: "Cuối cùng, cho tôi biết số điện thoại của bạn để chúng tôi liên hệ khi giao hàng."

forms:
  order_product:
    required_slots:
      - product_name
      - size
      - color
      - count
      - user_name
      - address
      - phone_number

  register:
    required_slots:
      - user_name
      - gender
      - birth_day
      - password

entities:
  - discount
  - color
  - brand
  - size
  - price
  - product_name
  - product_cd
  - count
  - address
  - phone_number
  - user_name

slots:
  product_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: order_product
            requested_slot: product_name

      - type: from_entity
        entity: product_name
        conditions:
          - active_loop: order_product
          - requested_slot: product_name

  size:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: order_product
            requested_slot: size

      - type: from_entity
        entity: size
        conditions:
          - active_loop: order_product
          - requested_slot: size

  color:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: order_product
            requested_slot: color

      - type: from_entity
        entity: color
        conditions:
          - active_loop: order_product

  count:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: order_product
            requested_slot: count

      - type: from_entity
        entity: count
        conditions:
          - active_loop: order_product
          - requested_slot: count

  user_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: order_product
            requested_slot: user_name
          - active_loop: register
            requested_slot: user_name

      - type: from_entity
        entity: user_name
        conditions:
          - active_loop: order_product
            requested_slot: user_name
          - active_loop: register
            requested_slot: user_name

  address:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: order_product
            requested_slot: address

      - type: from_entity
        entity: address
        conditions:
          - active_loop: order_product
            requested_slot: address

  phone_number:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: order_product
            requested_slot: phone_number

      - type: from_entity
        entity: phone_number
        conditions:
          - active_loop: order_product
            requested_slot: phone_number

  gender:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: register
            requested_slot: gender

  birth_day:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: register
            requested_slot: birth_day

  password:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: register
            requested_slot: password

  discount:
    type: text
    mappings:
      - type: from_entity
        entity: discount
        
  brand:
    type: text
    mappings:
      - type: from_entity
        entity: brand
        
  price:
    type: text
    mappings:
      - type: from_entity
        entity: price
        
  product_cd:
    type: text
    mappings:
      - type: from_entity
        entity: product_cd
        


actions:
  - action_hello_world
  - action_confirm_order
  - action_reset_slots

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
