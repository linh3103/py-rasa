version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - hello_world
  - product_category
  - choose_category
  - buy_blanket
  - ask_hotline_number
  - ask_working_hours
  - ask_lunch_break
  - ask_weekend_holiday

entities:
  - cat_code
  - row_count
  - category_nm

slots:
  cat_code:
    type: text
    mappings:
      - type: from_entity
        entity: cat_code
  row_count:
    type: text
    mappings:
      - type: from_entity
        entity: row_count
  category_nm:
    type: text
    mappings:
      - type: from_entity
        entity: category_nm
    
responses:
  utter_greet:
  - text: "Hey! How are you?"

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Did that help you?"

  utter_happy:
  - text: "Great, carry on!"

  utter_goodbye:
  - text: "Bye"

  utter_iamabot:
  - text: "I am a bot, powered by Rasa."

  utter_hello:
  - text: "rasa hello!!!!!!!!!!"

  utter_please_wait:
  - text: "Please wait...."

  utter_no_data:
  - text: "No data"

  utter_hotline_number:
    - text: "Bạn có thể gọi đến tổng đài 1588-2933 để được hỗ trợ."

  utter_working_hours:
    - text: "Tổng đài hoạt động từ 10:00 đến 17:00, từ thứ Hai đến thứ Sáu."

  utter_lunch_break:
    - text: "Trung tâm nghỉ trưa từ 12:00 đến 13:00."

  utter_weekend_holiday:
    - text: "Tổng đài không làm việc vào cuối tuần và các ngày lễ."

actions:
  - action_hello_world
  - action_fetch_categories
  - action_fetch_products_by_cat_code
  - action_buy_blanket

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
