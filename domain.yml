version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - hello_world
  - product_category
  - choose_category

entities:
  - cat_code

slots:
  cat_code:
    type: text
    mappings:
      - type: from_entity
        entity: cat_code

responses:
  utter_greet:
  - text: "Hey! How are you?"

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Did that help you?"

  utter_happy:
  - text: "Great, carry on!"

  utter_goodbye:
  - text: "Bye"

  utter_iamabot:
  - text: "I am a bot, powered by Rasa."

  utter_hello:
  - text: "rasa hello!!!!!!!!!!"

  utter_please_wait:
  - text: "Please wait...."

  utter_no_data:
  - text: "No data"

actions:
  - action_hello_world
  - action_fetch_categories
  - action_fetch_products_by_cat_code

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
